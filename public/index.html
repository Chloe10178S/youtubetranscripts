<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouTube Transcript Fetcher</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1rem 4rem;
    }

    .container {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .header { display: flex; flex-direction: column; gap: 0.4rem; }
    h1 { font-size: 1.75rem; font-weight: 700; color: #fff; letter-spacing: -0.02em; }
    .subtitle { font-size: 0.9rem; color: #777; }

    .input-row { display: flex; gap: 0.6rem; }
    .url-input {
      flex: 1;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      border: 1px solid #2e2e2e;
      background: #1a1a1a;
      color: #e8e8e8;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .url-input::placeholder { color: #555; }
    .url-input:focus { border-color: #ff4444; }

    .fetch-btn {
      padding: 0.7rem 1.5rem;
      background: #ff0000;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      white-space: nowrap;
    }
    .fetch-btn:hover:not(:disabled) { background: #cc0000; }
    .fetch-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .status { font-size: 0.875rem; color: #777; }

    .error-box {
      background: #1e0a0a;
      border: 1px solid #4a1515;
      border-radius: 8px;
      padding: 0.9rem 1.1rem;
      color: #f87171;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .transcript-card {
      background: #141414;
      border: 1px solid #252525;
      border-radius: 10px;
      overflow: hidden;
    }

    .transcript-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.7rem 1rem;
      border-bottom: 1px solid #222;
      background: #111;
      gap: 1rem;
    }

    .transcript-meta { font-size: 0.78rem; color: #555; white-space: nowrap; }

    .header-actions { display: flex; gap: 0.5rem; align-items: center; }

    .copy-btn {
      padding: 0.35rem 0.9rem;
      background: #222;
      color: #bbb;
      border: 1px solid #333;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .copy-btn:hover { background: #2e2e2e; color: #fff; }
    .copy-btn.copied { background: #0e2e1a; color: #4ade80; border-color: #1a5a30; }

    .transcript-body {
      max-height: 520px;
      overflow-y: auto;
      padding: 1.1rem 1.2rem;
      font-size: 0.9rem;
      line-height: 1.75;
      white-space: pre-wrap;
      word-break: break-word;
      color: #ccc;
      scrollbar-width: thin;
      scrollbar-color: #333 transparent;
    }
    .transcript-body::-webkit-scrollbar { width: 6px; }
    .transcript-body::-webkit-scrollbar-track { background: transparent; }
    .transcript-body::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useCallback } = React;

    function App() {
      const [url, setUrl] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [result, setResult] = useState(null);
      const [copied, setCopied] = useState(false);

      const fetchTranscript = useCallback(async () => {
        const trimmed = url.trim();
        if (!trimmed) return;
        setLoading(true);
        setError(null);
        setResult(null);
        try {
          const res = await fetch('/transcript', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: trimmed }),
          });
          const data = await res.json();
          if (!res.ok) {
            setError(data.error || `Server error ${res.status}`);
          } else {
            setResult(data);
          }
        } catch (err) {
          setError('Network error — could not reach the server. Is it running?');
        } finally {
          setLoading(false);
        }
      }, [url]);

      const handleKeyDown = (e) => {
        if (e.key === 'Enter') fetchTranscript();
      };

      const handleCopy = () => {
        if (!result) return;
        navigator.clipboard.writeText(result.transcript).then(() => {
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        });
      };

      return (
        <div className="container">
          <div className="header">
            <h1>YouTube Transcript Fetcher</h1>
            <p className="subtitle">Paste a YouTube URL to extract the full transcript.</p>
          </div>

          <div className="input-row">
            <input
              className="url-input"
              type="text"
              placeholder="https://www.youtube.com/watch?v=..."
              value={url}
              onChange={(e) => setUrl(e.target.value)}
              onKeyDown={handleKeyDown}
              disabled={loading}
              autoFocus
            />
            <button
              className="fetch-btn"
              onClick={fetchTranscript}
              disabled={loading || !url.trim()}
            >
              {loading ? 'Fetching…' : 'Get Transcript'}
            </button>
          </div>

          {loading && (
            <p className="status">Fetching transcript from YouTube…</p>
          )}

          {error && (
            <div className="error-box">
              <strong>Error:</strong> {error}
            </div>
          )}

          {result && (
            <div className="transcript-card">
              <div className="transcript-header">
                <span className="transcript-meta">
                  Video ID: {result.videoId}&nbsp;&nbsp;·&nbsp;&nbsp;{result.segments} segments
                </span>
                <div className="header-actions">
                  <button
                    className={`copy-btn${copied ? ' copied' : ''}`}
                    onClick={handleCopy}
                  >
                    {copied ? 'Copied!' : 'Copy transcript'}
                  </button>
                </div>
              </div>
              <div className="transcript-body">{result.transcript}</div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
